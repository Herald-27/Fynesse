<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Fynesse Budget Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a41;--gold:#b8832b;--gold-l:#e9b949;--ink:#1b2a41;--muted:#6b7a99;--page:#eef0f4;--screen:#fff;--card:#fff;--frame:#1b2a41}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0f1520;--screen:#fff}}
:root[data-theme="dark"]{--page:#0f1520}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--page);font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.phone{width:min(380px,100%);height:min(780px,100vh);background:var(--screen);border:10px solid var(--frame);border-radius:44px;position:relative;overflow:hidden;box-shadow:0 24px 60px rgba(10,20,40,.25)}
@media (max-width:480px){.phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}}
.blob{position:absolute;pointer-events:none}
.gold-tr{top:-70px;right:-80px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 60% 40%,#e9b949 0%,#f1cb70 45%,rgba(255,255,255,0) 72%)}
.navy-bl{left:-90px;bottom:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 55% 45%,#0e1a2a 0%,#1b2a41 45%,rgba(27,42,65,0) 70%)}
.gold-bl{left:60px;bottom:-110px;width:230px;height:200px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#e9b949 0%,rgba(233,185,73,0) 70%)}
.rings{left:-20px;bottom:-20px;width:120px;height:120px;border:1px solid rgba(255,255,255,.12);border-radius:50%}
.hero{position:absolute;inset:0 0 190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px}
.logo{width:112px;height:112px;border-radius:50%;background:#fff;box-shadow:0 10px 28px rgba(27,42,65,.18),0 0 0 14px rgba(0,0,0,.025);display:grid;place-items:center;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.logo{animation:none}}
h1{font-family:'Playfair Display',serif;font-weight:700;font-size:30px;color:var(--gold);margin-top:22px;letter-spacing:.2px}
.sub{font-weight:700;font-size:13px;letter-spacing:1.6px;color:var(--navy);margin-top:6px}
.tag{font-size:12px;color:var(--muted);margin-top:14px}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 20px 18px;text-align:center}
.cta{width:100%;height:52px;border:0;border-radius:999px;color:#fff;font:700 15px 'Plus Jakarta Sans',sans-serif;letter-spacing:.3px;cursor:pointer;background:linear-gradient(90deg,#1b2a41 0%,#1b2a41 25%,#b8832b 100%);box-shadow:0 8px 20px rgba(27,42,65,.25);transition:transform .15s,box-shadow .15s}
.cta:hover{box-shadow:0 10px 24px rgba(27,42,65,.32)}
.cta:active{transform:scale(.97)}
.cta:focus-visible,.login:focus-visible{outline:3px solid var(--gold-l);outline-offset:3px}
.acct{font-size:12px;color:#fff;margin-top:14px;position:relative;text-shadow:0 0 6px rgba(0,0,0,.4)}
.login{background:none;border:0;font:700 12px 'Plus Jakarta Sans',sans-serif;color:var(--gold-l);cursor:pointer;padding:4px}
.bar{width:100px;height:4px;border-radius:4px;background:rgba(255,255,255,.85);margin:14px auto 0}
.toast{position:absolute;left:20px;right:20px;top:64px;background:var(--navy);color:#fff;font-size:13px;padding:12px 16px;border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(-10px);transition:.25s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:none}

.phone{display:flex;flex-direction:column}
.view{position:absolute;inset:0;overflow-y:auto;padding:16px 16px 96px;background:#eceff4;color:var(--ink)}
.view.nonav{padding-bottom:24px}
.view::before{content:"";position:fixed}
.wave{position:absolute;top:-60px;right:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 40% 55%,#d4a22e 0 55%,#ecd9a6 56% 70%,transparent 71%);pointer-events:none}
.wave2{position:absolute;left:-60px;bottom:70px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 60% 40%,#1b2a41 0 55%,#d4a22e 56% 75%,transparent 76%);pointer-events:none;opacity:.9}
.in{position:relative;z-index:1}
h2{font-size:21px;font-weight:700;text-align:center;margin:6px 0 16px;color:var(--navy)}
.back{background:none;border:0;font:700 13px inherit;color:var(--navy);cursor:pointer;padding:4px 0}
.card{background:#eceff4;border-radius:16px;padding:14px;box-shadow:5px 5px 12px rgba(160,170,190,.45),-4px -4px 10px #fff;margin-bottom:12px}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px;color:var(--navy);text-transform:uppercase}
input,select{width:100%;height:40px;border:1.5px solid #aab3c4;border-radius:10px;background:#eef1f6;padding:0 12px;font:500 14px 'Plus Jakarta Sans',sans-serif;color:var(--navy)}
input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.err{color:#c0392b;font-size:12px;margin-top:4px;min-height:14px}
.grad{width:100%;height:48px;border:0;border-radius:999px;color:#fff;font:700 15px 'Plus Jakarta Sans',sans-serif;cursor:pointer;background:linear-gradient(90deg,#1b2a41,#1b6b86 50%,#c99a2e);box-shadow:0 6px 14px rgba(27,42,65,.25);margin-top:14px}
.grad:active{transform:scale(.97)}
.out{display:block;margin:14px auto 0;border:2px solid var(--navy);background:#fff;color:var(--gold);font:700 14px 'Plus Jakarta Sans',sans-serif;padding:11px 26px;border-radius:999px;cursor:pointer}
.link{background:none;border:0;font:700 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;color:#c0392b;text-transform:uppercase}
.row2{display:flex;gap:12px}.row2 .card{flex:1;text-align:center;margin:0}
.small{font-size:12px;text-transform:uppercase}.big{font-size:21px;font-weight:700}
.rem{background:linear-gradient(90deg,#1b2a41,#1b6b86 50%,#c99a2e);color:#fff;text-align:center;border-radius:16px;padding:16px;margin:14px 0}
.rem .big{font-size:28px}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #cfd5e0;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:var(--navy);cursor:pointer}
.ic{width:34px;height:34px;border-radius:50%;background:#d4a22e;display:grid;place-items:center;font-size:17px;flex:none}
.tx b{font-size:13px;text-transform:uppercase}.tx small{display:block;font-size:12px;text-transform:uppercase;opacity:.8}.tx .amt{margin-left:auto;font-weight:700;font-size:13px;white-space:nowrap}
.hd{display:flex;justify-content:space-between;align-items:center}.hd button{background:none;border:0;font-size:24px;cursor:pointer;color:var(--navy);position:relative}
.dot{position:absolute;top:0;right:0;width:9px;height:9px;border-radius:50%;background:#c0392b}
.ok{color:#a8841c;font-weight:700;font-size:13px;margin:10px 0;text-transform:uppercase}
.prog{height:30px;border-radius:15px;background:#c99a2e;overflow:hidden;position:relative}.prog i{display:block;height:100%;background:linear-gradient(90deg,#1b2a41,#1b6b86);border-radius:15px 0 0 15px}.prog span{position:absolute;right:12px;top:6px;font-weight:700;font-size:13px}
.stat{text-align:center;padding:8px 0;border-bottom:1px solid #cfd5e0}.stat:last-child{border:0}
nav{position:absolute;left:10px;right:10px;bottom:10px;height:62px;background:#fff;border-radius:22px;display:flex;justify-content:space-around;align-items:center;z-index:5;box-shadow:0 -2px 12px rgba(27,42,65,.12)}
nav button{width:44px;height:44px;border:0;border-radius:50%;background:none;color:#8791a6;cursor:pointer;display:grid;place-items:center}
nav button.on{background:var(--navy);color:#fff}
.nt{margin-bottom:10px}.nt.read{opacity:.6}.nt h4{font-size:15px;color:var(--navy)}.nt p{font-size:12.5px;text-transform:uppercase;padding-right:60px;margin-top:4px}.nt time{position:absolute;right:14px;bottom:14px;font-size:11px}
.nt{position:relative}
.set{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:10px 0;font:500 14px 'Plus Jakarta Sans',sans-serif;color:var(--navy);text-transform:uppercase;cursor:pointer}.set span:last-child{margin-left:auto}
.sh{font-weight:700;font-size:14px;margin:8px 0 2px;color:var(--navy)}
.tabs{display:flex;gap:6px;padding:4px;border-radius:12px;box-shadow:inset 0 0 0 1px #cfd5e0;margin:10px 0}.tabs button{flex:1;border:0;background:none;padding:8px 2px;border-radius:9px;font:600 12px 'Plus Jakarta Sans',sans-serif;color:var(--navy);cursor:pointer}.tabs .on{background:#cfd5e3}
.modal{position:absolute;inset:0;background:rgba(20,28,44,.55);display:grid;place-items:center;z-index:10;padding:30px}
.dlg{background:#eceff4;border-radius:16px;padding:20px;text-align:center;width:100%}
.dlg h3{margin:8px 0;color:var(--navy);text-transform:uppercase}.dlg .cancel{margin-top:10px;width:100%;height:42px;border-radius:999px;border:1.5px solid #aab3c4;background:#fff;font:700 14px 'Plus Jakarta Sans',sans-serif;color:#4a5670;cursor:pointer}
.empty{text-align:center;padding:30px 10px;font-size:13px;color:var(--muted)}
.splash{position:absolute;inset:0;background:#fff}

h1{font-family:'Playfair Display',serif;color:var(--gold);font-size:30px;font-weight:700}
.toast{z-index:20}.trk{height:10px;border-radius:5px;background:#dcdfe5;overflow:hidden}.trk i{display:block;height:100%;border-radius:5px}.tdy{position:absolute;top:12px;transform:translateX(-50%);font-size:10px;background:#dcdfe5;padding:0 6px;border-radius:3px}.tdy::before{content:'';position:absolute;left:50%;top:-12px;height:12px;border-left:1px solid #8a93a6}.bc{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #cfd5e0;padding:12px 0;font:inherit;color:var(--navy);cursor:pointer;align-items:flex-start}.bc:last-child{border:0}.hd2{display:flex;justify-content:space-between;margin-bottom:8px;text-transform:uppercase;font-size:13px}.bc small,.stat small{font-size:11.5px}.hint{font-size:12px;color:#4a5670;margin:8px 0}.dy{display:grid;grid-template-columns:76px 1fr 64px;gap:8px;align-items:center;font-size:11.5px;padding:5px 0}.dy span:last-child{text-align:right;font-weight:700}#pf{margin-bottom:8px}.greet{font-size:20px;font-weight:700;margin:14px 0 8px;color:var(--navy)}.quote{font-size:13.5px;font-style:italic;color:#4a5670;margin:-4px 0 12px}.ab p{font-size:13.5px;line-height:1.5}.ab ul{padding-left:18px;margin:4px 0}.ab li{margin:8px 0;font-size:13.5px;line-height:1.45}.set:disabled{cursor:default}</style></head>
<body><main class="phone" id="app"></main>
<script>(()=>{const SPLASH=`<section class="hero">
    <div class="logo" role="img" aria-label="Fynesse logo">
      <svg width="92" height="92" viewBox="0 0 92 92">
        <circle cx="46" cy="46" r="43" fill="none" stroke="#1b2a41" stroke-width="2.5"/>
        <circle cx="46" cy="46" r="37" fill="none" stroke="#e3c88b" stroke-width="1" stroke-dasharray="2 3"/>
        <rect x="26" y="46" width="9" height="16" fill="#1b2a41"/>
        <rect x="38" y="40" width="9" height="22" fill="#b8832b"/>
        <rect x="50" y="34" width="9" height="28" fill="#1b2a41"/>
        <path d="M24 44 L40 34 L50 38 L66 24" fill="none" stroke="#1b2a41" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M60 22 L68 22 L68 30" fill="none" stroke="#1b2a41" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M54 62 C56 54 62 50 68 50 C68 58 62 63 54 62Z" fill="#3c7a3f"/>
      </svg>
    </div>
    <h1>Fynesse</h1>
    <p class="sub">BUDGET TRACKER</p>
    <p class="tag">Smart Tracking, Smarter Living</p>
  </section>

  <section class="bottom">
    <button class="cta" data-go="login">GET STARTED</button>
    <p class="acct">Already have an account? <button class="login" data-go="login">Log In</button></p>
    <div class="bar"></div>
  </section>`;
const $=s=>document.querySelector(s),app=$('#app');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=iso(new Date()),D=s=>new Date(s+'T00:00');
const add=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const endOf=(s,p)=>{if(p==='Weekly')return add(s,7);const d=D(s);d.setMonth(d.getMonth()+1);return iso(d)};
const dd=(a,b)=>Math.round((D(b)-D(a))/864e5);
const CAT={Food:'🍔','Transportation':'🚌','School Supply':'📘',Bills:'🧾',Other:'🛒'};
const S={scr:'splash',ns:{on:true,sound:'Chime'},quote:'',cur:'₱',user:{name:'User',email:''},bs:[{id:1,cat:'Food',amount:6000,period:'Monthly',start:add(TODAY,-10),end:endOf(add(TODAY,-10),'Monthly')},{id:2,cat:'Transportation',amount:700,period:'Weekly',start:add(TODAY,-3),end:endOf(add(TODAY,-3),'Weekly')},{id:3,cat:'Bills',amount:5000,period:'Monthly',start:add(TODAY,-20),end:endOf(add(TODAY,-20),'Monthly')}],pf:'all',bid:null,edb:false,id:10,flash:'',filter:'all',q:'',eid:null,modal:'',pw:false,last:null,err:'',
ex:[{id:1,amt:250,cat:'Food',date:TODAY,desc:'Lunch'},{id:2,amt:100,cat:'Transportation',date:add(TODAY,-1),desc:'Jeepney fare'},{id:3,amt:500,cat:'School Supply',date:add(TODAY,-2),desc:'Note book'},{id:4,amt:4300,cat:'Bills',date:add(TODAY,-8),desc:'Dorm rent'},{id:5,amt:3600,cat:'Food',date:add(TODAY,-4),desc:'Groceries'}],
nt:[{h:'Budget alert',t:'You have used 62.5% of your budget.',a:'2 Hrs Ago',i:'🔔',r:0},{h:'Expense reminder',t:"Don't forget to record today's expenses.",a:'5 Hrs Ago',i:'🔔',r:0},{h:'Budget updated',t:'Your budget was updated successfully.',a:'1 Day Ago',i:'✔',r:0}]};
const f=n=>S.cur+Number(n).toLocaleString('en-PH',{maximumFractionDigits:2}),f2=n=>S.cur+Number(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const dl=d=>new Date(d+'T00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
const ds=d=>new Date(d+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase();
const bsp=b=>S.ex.filter(e=>e.cat===b.cat&&e.date>=b.start&&e.date<=b.end).reduce((a,e)=>a+e.amt,0);
const act=()=>S.bs.filter(b=>b.end>=TODAY),tot=()=>act().reduce((a,b)=>a+b.amount,0),spent=()=>act().reduce((a,b)=>a+bsp(b),0),rem=()=>Math.max(0,tot()-spent());
const nd=b=>Math.max(1,dd(b.start,b.end)),pd=b=>b.amount/nd(b),el=b=>Math.min(1,Math.max(0,dd(b.start,TODAY)/nd(b))),pc=b=>bsp(b)/b.amount;
const st=b=>{const p=pc(b);return p>=1?['Over budget','#e53935']:p>=.8?['Nearly closing','#f59e0b']:p>el(b)+.05?['Ahead of pace','#f59e0b']:['On track','#16a34a']};
const hint=(a,s,p)=>{const n=dd(s,endOf(s,p));return a>0?`Suggested spending: ${f(a/n)} per day for ${n} days`:`${n} days. Enter an amount to see your daily budget.`};
const bar=b=>{const [l,c]=st(b);return `<div style="position:relative;padding-bottom:20px"><div class="trk"><i style="width:${Math.min(1,pc(b))*100}%;background:${c}"></i></div><span class="tdy" style="left:clamp(24px,${el(b)*100}%,calc(100% - 24px))">Today</span></div>`};
const bcard=b=>{const [l,c]=st(b);return `<button class="bc" data-b="${b.id}"><span class="ic">${CAT[b.cat]}</span><div style="flex:1"><div class="hd2"><b>${b.cat}</b><b style="color:${c}">${f(b.amount)}</b></div>${bar(b)}<small>${f(bsp(b))} spent · ${f(pd(b))}/day · ${l}</small></div></button>`};
const brow=b=>`<button class="tx" data-b="${b.id}"><span class="ic">${CAT[b.cat]}</span><span><b>${b.cat} budget</b><small>${b.period}: ${ds(b.start)} to ${ds(b.end)}</small></span><span class="amt" style="color:#16a34a">+${f(b.amount)}</span></button>`;
const note=(h,t,i)=>{S.nt.unshift({h,t,a:'Just now',i,r:0});if(S.ns.on)play(S.ns.sound)};
const I={home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',wal:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h5M6 6l9-3v3"/>',doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h5"/>',bar:'<rect x="4" y="12" width="4" height="8"/><rect x="10" y="8" width="4" height="12"/><rect x="16" y="4" width="4" height="16"/>',gear:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>'};
const ico=k=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${I[k]}</svg>`;
const DEF=['Food','Transportation','School Supply','Bills','Other'],CUR=[['₱','Philippine Peso'],['$','US Dollar'],['€','Euro'],['£','British Pound'],['¥','Japanese Yen']];
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const QUOTES=['Give every peso a job before the day begins.','Small savings today become big choices tomorrow.','Track it, trim it, grow it.','A plan for your money is a plan for your peace.','Spend on what matters, skip what doesn’t.','Progress beats perfection, one expense at a time.','Tomorrow’s you is counting on today’s budget.','Know where it goes, and it goes further.','Saving is a habit, not a sacrifice.','Your budget is a map, not a cage.'];
const pickQuote=()=>{let q;do{q=QUOTES[Math.floor(Math.random()*QUOTES.length)]}while(q===S.quote&&QUOTES.length>1);S.quote=q};
const hello=()=>{const h=new Date().getHours();return (h<12?'Good morning':h<18?'Good afternoon':'Good evening')+', '+esc(S.user.name.split(' ')[0])+'!'};
const SND={Chime:[[880,0,.25],[1318,.14,.4]],Bell:[[1175,0,.8],[1568,0,.6]],Beep:[[800,0,.12],[800,.2,.12]],Pop:[[520,0,.1]]};
let ac;const play=n=>{const q=SND[n];if(!q)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();q.forEach(([fr,d,l])=>{const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+d;o.type=n==='Beep'?'square':'sine';o.frequency.value=fr;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(n==='Beep'?.12:.25,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+l);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+l+.05)})}catch(e){}};
const wv='<div class="wave"></div>',wv2='<div class="wave2"></div>';
const hdr=(t,b)=>`<div class="in"><button class="back" data-go="${b}">← BACK</button><h2>${t}</h2>`;
const NAVMAP={home:'home',addexp:'home',saved:'home',budget:'budget',addbudget:'budget',bdet:'budget',notifs:'settings',about:'settings',profile:'settings',currency:'settings',cats:'settings',stats:'stats',tx:'tx',edit:'tx',notes:'home',settings:'settings'};
const catOpts=c=>Object.keys(CAT).map(k=>`<option ${k===c?'selected':''}>${k}</option>`).join('');
const txRow=e=>`<button class="tx" data-edit="${e.id}"><span class="ic">${CAT[e.cat]||'🛒'}</span><span><b>${e.cat}</b><small>${e.desc||''}</small></span><span class="amt">-${f(e.amt)}<br><small>${ds(e.date)}</small></span></button>`;
const V={
splash:()=>`<div class="splash"><div class="blob gold-tr"></div><div class="blob navy-bl"></div><div class="blob gold-bl"></div>${SPLASH}</div>`,
login:()=>`<div class="view nonav">${wv}${wv2}<div class="in" style="text-align:center;padding-top:30px"><h1 style="margin:0">Fynesse</h1><p class="sub">BUDGET TRACKER</p></div><div class="in card" style="margin-top:26px"><label for="u">Email / Username *</label><input id="u" autocomplete="username" placeholder="Enter your email"><label for="p">Password</label><div style="position:relative"><input id="p" type="${S.pw?'text':'password'}" autocomplete="current-password" placeholder="Enter your password"><button data-act="pw" aria-label="Show or hide password" style="position:absolute;right:8px;top:6px;border:0;background:none;cursor:pointer;font-size:16px">${S.pw?'🙈':'👁'}</button></div><p class="err" id="e">${S.err}</p><p style="text-align:center"><button class="link" style="color:#1b6b86" data-act="forgot">Forgot Password?</button></p><button class="grad" data-act="login">LOGIN</button><p style="text-align:center;font-size:13px;margin-top:14px">Don't have an account? <button class="link" style="color:#c99a2e" data-act="signup">Sign Up</button></p></div></div>`,
home:()=>`<div class="view">${wv}${wv2}<div class="in"><div class="hd"><button data-go="settings" aria-label="Menu">☰</button><h2 style="margin:0">BUDGET TRACKER</h2><button data-go="notes" aria-label="Notifications">🔔${S.nt.some(n=>!n.r)?'<i class="dot"></i>':''}</button></div>${S.flash?`<p class="ok">✔ ${S.flash}</p>`:`<p class="greet">${hello()}</p><p class="quote">“${S.quote}”</p>`}${S.bs.length?'':'<div class="card empty">No budget yet. Add one to start tracking.</div>'}<div class="row2"><div class="card"><div class="small">Total budget</div><div class="big">${f(tot())}</div></div><div class="card"><div class="small">Spent</div><div class="big">${f(spent())}</div></div></div><div class="rem"><div class="small" style="font-size:15px">REMAINING BALANCE</div><div class="big">${f(rem())}</div></div>${S.ex.length?`<h3 style="color:var(--navy)">RECENT TRANSACTIONS</h3>`+[...S.ex].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(txRow).join(''):''}<button class="out" data-go="addexp">+ ADD EXPENSE</button></div></div>`,
budget:()=>{const a=act();return `<div class="view">${wv}${hdr('MY BUDGET','home')}${a.length?`<div class="card"><div class="stat"><b>TOTAL BUDGET</b><div class="big">${f(tot())}</div></div><div class="stat"><b>SPENT</b><div class="big">${f(spent())}</div></div><div class="stat"><b>REMAINING</b><div class="big" style="color:#c99a2e">${f(rem())}</div></div></div><div class="card" style="padding:2px 14px">${a.map(bcard).join('')}</div>`:'<div class="card empty">No active budgets. Add one to start tracking.</div>'}<button class="out" data-go="addbudget">+ ADD BUDGET</button></div></div>`},
addbudget:()=>{const b=S.edb?S.bs.find(x=>x.id===S.bid):{cat:'Food',amount:'',period:'Weekly',start:TODAY};return `<div class="view">${wv}${hdr(S.edb?'EDIT BUDGET':'ADD BUDGET','budget')}<div class="card"><label for="ca">Category</label><select id="ca">${catOpts(b.cat)}</select><label for="a">Budget amount (${S.cur})</label><input id="a" type="number" min="1" inputmode="decimal" value="${b.amount}" placeholder="7000"><label for="pe">Period</label><select id="pe">${['Weekly','Monthly'].map(x=>`<option ${x===b.period?'selected':''}>${x}</option>`).join('')}</select><label for="s">Start date</label><input id="s" type="date" min="${S.edb&&b.start<TODAY?b.start:TODAY}" value="${b.start}"><label for="en">End date (automatic)</label><input id="en" type="date" value="${endOf(b.start,b.period)}" disabled><p class="hint" id="pdh">${hint(+b.amount,b.start,b.period)}</p><p class="err" id="e"></p><button class="grad" data-act="saveb">SAVE BUDGET</button></div></div></div>`},
bdet:()=>{const b=S.bs.find(x=>x.id===S.bid);if(!b)return V.budget();const s=bsp(b),[l,c]=st(b),days=Array.from({length:nd(b)},(_,i)=>add(b.start,i));return `<div class="view">${wv}${hdr(b.cat.toUpperCase()+' BUDGET','budget')}<div class="card"><div class="stat"><b>${b.period.toUpperCase()}</b><div style="font-size:13px">${dl(b.start)} to ${dl(b.end)}</div></div><div class="stat"><b>BUDGET</b><div class="big">${f(b.amount)}</div></div><div class="stat"><b>SPENT</b><div class="big">${f(s)}</div></div><div class="stat"><b>REMAINING</b><div class="big" style="color:#c99a2e">${f(Math.max(0,b.amount-s))}</div>${s>b.amount?`<small style="color:#e53935">Over budget by ${f(s-b.amount)}</small>`:''}</div>${bar(b)}<p style="text-align:center;font-weight:700;color:${c}">${l}</p></div><div class="card"><b>DAILY SPENDING</b><p class="hint">Suggested ${f(pd(b))} per day. You can go over; this is only a guide.</p>${days.map(d=>{const x=S.ex.filter(e=>e.cat===b.cat&&e.date===d).reduce((a,e)=>a+e.amt,0);return `<div class="dy"><span>${ds(d)}${d===TODAY?' (today)':''}</span><div class="trk"><i style="width:${Math.min(1,x/pd(b))*100}%;background:${x>pd(b)?'#e53935':'#16a34a'}"></i></div><span>${f(x)}</span></div>`}).join('')}</div><div class="hd"><button class="link" data-act="editb">Edit</button><button class="link" data-act="delb">Delete</button></div></div></div>`},
stats:()=>{const a=act(),n=a.filter(b=>pc(b)>=.8&&pc(b)<1),o=a.filter(b=>pc(b)>=1),ts=S.ex.filter(e=>e.date===TODAY).reduce((x,e)=>x+e.amt,0),sg=a.filter(b=>b.start<=TODAY).reduce((x,b)=>x+pd(b),0);return `<div class="view">${wv}${hdr('ANALYTICS','home')}${!a.length?'<div class="card empty">Add a budget to see analytics.</div>':`<div class="card"><b>BUDGET STATUS</b><p style="margin-top:6px;font-size:14px;color:${o.length?'#e53935':n.length?'#d97706':'#16a34a'}">${o.length?`${o.length} over budget (${o.map(b=>b.cat).join(', ')}). `:''}${n.length?`${n.length} nearly closing (${n.map(b=>b.cat).join(', ')}).`:o.length?'':'All budgets are on track.'}</p></div><div class="card"><div class="stat"><b>OVERALL USED</b><div class="big">${tot()?Math.round(spent()/tot()*100):0}%</div></div><div class="stat"><b>SPENT TODAY</b><div class="big">${f(ts)}</div><small>Suggested for today: ${f(sg)}</small></div></div><div class="card" style="padding:2px 14px">${a.map(b=>{const [l,c]=st(b);return `<div class="stat" style="text-align:left"><div class="hd2"><b>${b.cat}</b><b style="color:${c}">${l}</b></div>${bar(b)}<small>${Math.round(pc(b)*100)}% used, ${f(Math.max(0,b.amount-bsp(b)))} left, ${Math.max(0,dd(TODAY,b.end))} days left</small></div>`}).join('')}</div>`}</div></div>`},
profile:()=>`<div class="view">${wv}${hdr('PROFILE','settings')}<div class="card"><label for="pn">Full name</label><input id="pn" value="${esc(S.user.name)}" autocomplete="name"><label for="pm">Email</label><input id="pm" type="email" value="${esc(S.user.email)}" placeholder="you@example.com" autocomplete="email"><p class="err" id="e"></p><button class="grad" data-act="saveprof">SAVE CHANGES</button></div></div></div>`,
currency:()=>`<div class="view">${wv}${hdr('CURRENCY','settings')}<div class="card" style="padding:4px 14px">${CUR.map(([c,n])=>`<button class="set" data-act="cur" data-v="${c}"><span>${c}</span><span>${n}</span><span>${c===S.cur?'✔':''}</span></button>`).join('')}</div><p class="hint">Changing currency updates the symbol only. Amounts are not converted.</p></div></div>`,
cats:()=>`<div class="view">${wv}${hdr('CATEGORIES','settings')}<div class="card"><label for="cn">New category</label><input id="cn" maxlength="20" placeholder="e.g. Health"><label for="ci">Emoji (optional)</label><input id="ci" maxlength="4" placeholder="🏷️"><p class="err" id="e"></p><button class="grad" data-act="addcat">ADD CATEGORY</button></div><div class="card" style="padding:4px 14px">${Object.keys(CAT).map(k=>`<div class="set" style="cursor:default"><span>${CAT[k]}</span><span>${k}</span>${DEF.includes(k)?'':`<button class="link" style="margin-left:auto" data-act="delcat" data-v="${k}" aria-label="Delete ${k}">Delete</button>`}</div>`).join('')}</div></div></div>`,
notifs:()=>`<div class="view">${wv}${hdr('NOTIFICATIONS','settings')}<div class="card" style="padding:4px 14px"><button class="set" role="switch" aria-checked="${S.ns.on}" data-act="ntog"><span>🔊</span><span>Sound alerts</span><span style="font-weight:700;color:${S.ns.on?'#16a34a':'#8791a6'}">${S.ns.on?'ON':'OFF'}</span></button></div><div class="card" style="padding:4px 14px;${S.ns.on?'':'opacity:.5'}"><p class="sh">NOTIFICATION SOUND</p>${Object.keys(SND).map(k=>`<button class="set" data-act="nsnd" data-v="${k}" ${S.ns.on?'':'disabled'}><span>${k===S.ns.sound?'🔔':'▫️'}</span><span>${k}</span><span>${k===S.ns.sound?'✔':'▶'}</span></button>`).join('')}</div><p class="hint">Tap a sound to preview and select it. It plays when you get a new notification, such as a budget alert.</p></div></div>`,
about:()=>`<div class="view">${wv}${hdr('ABOUT BUDGET TRACKER','settings')}<div class="card ab"><p class="sh">What is Fynesse?</p><p>Fynesse Budget Tracker helps you plan your money, record what you spend and stay on top of your budgets. Smart tracking, smarter living.</p></div><div class="card ab"><p class="sh">What you can do</p><ul><li><b>Set budgets by category</b> for food, transportation, bills and more, weekly or monthly.</li><li><b>See a daily guide.</b> A ₱7,000 weekly budget suggests about ₱1,000 per day. You can go over it, it is only a guide.</li><li><b>Add expenses.</b> Each one is deducted from the budget with the same category.</li><li><b>Review transactions.</b> Search them, and filter by budgets, expenses and period.</li><li><b>Check analytics</b> to see which budgets are nearly closing or over.</li><li><b>Get notifications</b> with a sound you choose.</li><li><b>Make it yours</b> by changing your profile, currency and categories.</li></ul></div><p class="hint" style="text-align:center">Version 1.0 prototype. Data resets when you reload the page.</p></div></div>`,
signup:()=>`<div class="view nonav">${wv}${wv2}<div class="in" style="text-align:center;padding-top:20px"><h1 style="margin:0">Fynesse</h1><p class="sub">BUDGET TRACKER</p></div><div class="in card" style="margin-top:18px"><label for="sn">Full name</label><input id="sn" autocomplete="name" placeholder="Enter your full name"><label for="se">Email</label><input id="se" type="email" autocomplete="email" placeholder="Enter your email"><label for="sp">Password</label><input id="sp" type="password" autocomplete="new-password" placeholder="Create a password"><label for="sc">Confirm password</label><input id="sc" type="password" autocomplete="new-password" placeholder="Re-enter your password"><p class="err" id="e"></p><button class="grad" data-act="signup2">SIGN UP</button><p style="text-align:center;font-size:13px;margin-top:14px">Already have an account? <button class="link" style="color:#c99a2e" data-go="login">Log In</button></p></div></div>`,
addexp:()=>`<div class="view">${wv}${hdr('ADD EXPENSE','home')}<div class="card">${form({amt:'',cat:'Food',date:TODAY,desc:''})}<button class="grad" data-act="savex">SAVE EXPENSE</button></div></div></div>`,
saved:()=>{const e=S.last;return `<div class="view">${wv}${hdr('EXPENSE SAVED','home')}<p class="ok">✔ Expense added successfully</p><div class="card"><label>Amount</label><p>${f2(e.amt)}</p><label>Category</label><p>${e.cat.toUpperCase()}</p><label>Description</label><p>${(e.desc||'—').toUpperCase()}</p><button class="grad" data-go="home">BACK TO DASHBOARD</button></div></div></div>`},
tx:()=>`<div class="view">${wv}${hdr('TRANSACTIONS','home')}<input id="q" type="search" placeholder="Search Transactions..." value="${S.q}" aria-label="Search transactions"><div class="tabs">${[['all','ALL'],['income','BUDGETS'],['expenses','EXPENSES']].map(([k,t])=>`<button data-f="${k}" class="${S.filter===k?'on':''}">[${t}]</button>`).join('')}</div><select id="pf" aria-label="Budget period">${[['all','All budget periods'],['Weekly','Weekly budgets'],['Monthly','Monthly budgets']].map(([k,t])=>`<option value="${k}" ${S.pf===k?'selected':''}>${t}</option>`).join('')}</select><div id="list">${list()}</div></div></div>`,
edit:()=>{const e=S.ex.find(x=>x.id===S.eid);return `<div class="view">${wv}${hdr('EDIT EXPENSE','tx')}<div class="card">${form(e)}<button class="grad" data-act="savech">SAVE CHANGES</button><p style="text-align:center;margin-top:12px"><button class="link" data-act="delx">DELETE EXPENSE</button></p></div></div></div>`},
notes:()=>`<div class="view">${wv}${hdr('NOTIFICATIONS','home')}${S.nt.map(n=>`<div class="card nt ${n.r?'read':''}"><h4>${n.i} ${n.h.toUpperCase()}</h4><p>${n.t}</p><time>[${n.a}]</time></div>`).join('')||'<div class="empty">You are all caught up.</div>'}<button class="out" style="width:100%;margin-top:0;color:var(--navy)" data-act="readall">MARK ALL AS READ</button></div></div>`,
settings:()=>{const r=(i,t,k)=>`<button class="set" ${k?`data-go="${k}"`:`data-act="soon" data-n="${t}"`}><span>${i}</span><span>${t}</span><span>→</span></button>`;return `<div class="view">${wv}${hdr('SETTINGS','home')}<div class="card"><p class="sh">ACCOUNT</p>${r('👤','Profile','profile')}${r('🔒','Change password')}<p class="sh">PREFERENCES</p>${r(S.cur,'Currency','currency')}${r('🔔','Notifications','notifs')}${r('☰','Categories','cats')}<p class="sh">ABOUT</p>${r('ℹ️','About Budget Tracker','about')}</div><button class="grad" data-act="lo">LOGOUT</button></div></div>`},
out:()=>`<div class="view nonav">${wv}${wv2}<div class="in" style="text-align:center;padding-top:40px"><h2>BUDGET TRACKER</h2><div style="font-size:70px;margin:20px 0">🚪</div><div class="card"><h2 style="margin:6px 0">YOU HAVE BEEN LOGGED OUT.</h2><button class="grad" data-go="login">LOGIN</button></div></div></div>`};
function form(e){return `<label for="am">Amount (${S.cur})</label><input id="am" type="number" min="0.01" step="0.01" inputmode="decimal" value="${e.amt}" placeholder="250.00"><label for="ca">Category</label><select id="ca">${catOpts(e.cat)}</select><label for="da">Date</label><input id="da" type="date" value="${e.date}"><label for="de">Description</label><input id="de" value="${e.desc}" placeholder="Lunch"><p class="err" id="e"></p>`}
function list(){const q=S.q.toLowerCase(),it=[];if(S.filter!=='expenses')S.bs.filter(b=>(S.pf==='all'||b.period===S.pf)&&(b.cat+b.period).toLowerCase().includes(q)).forEach(b=>it.push({date:b.start,b}));if(S.filter!=='income')S.ex.filter(e=>(e.cat+e.desc).toLowerCase().includes(q)).forEach(e=>it.push({date:e.date,e}));if(!it.length)return '<div class="empty">No transactions found.</div>';const g={};it.sort((x,y)=>y.date.localeCompare(x.date)).forEach(x=>(g[x.date]=g[x.date]||[]).push(x));return Object.keys(g).map(d=>`<p class="sh" style="border-bottom:1px solid #cfd5e0">${d===TODAY?'TODAY':dl(d)}</p>`+g[d].map(x=>x.b?brow(x.b):txRow(x.e)).join('')).join('')}
function modal(){return S.modal==='lo'?`<div class="modal"><div class="dlg"><div style="font-size:34px">⚠️</div><h3>Logout account?</h3><p style="font-size:13px">ARE YOU SURE YOU WANT TO LOGOUT?</p><button class="grad" style="height:42px" data-act="lo2">LOGOUT</button><button class="cancel" data-act="cx">CANCEL</button></div></div>`:S.modal==='db'?`<div class="modal"><div class="dlg"><div style="font-size:34px">⚠️</div><h3>Delete budget?</h3><p style="font-size:13px">THIS REMOVES YOUR CURRENT BUDGET.</p><button class="grad" style="height:42px" data-act="db2">DELETE</button><button class="cancel" data-act="cx">CANCEL</button></div></div>`:''}
function draw(){const s=S.scr,nav=NAVMAP[s]?`<nav aria-label="Main">${[['home','home'],['budget','wal'],['tx','doc'],['stats','bar'],['settings','gear']].map(([g,i])=>`<button data-go="${g}" aria-label="${g}" class="${NAVMAP[s]===g?'on':''}">${ico(i)}</button>`).join('')}</nav>`:'';app.innerHTML=V[s]()+nav+modal()+'<div class="toast" id="toast" role="status"></div>';S.flash='';S.err=''}
function go(s){S.scr=s;draw()}
let th;function say(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(th);th=setTimeout(()=>t.classList.remove('show'),2200)}
const v=i=>($('#'+i)||{}).value;
function readX(){const amt=parseFloat(v('am')),date=v('da');if(!(amt>0)){$('#e').textContent='Enter an amount greater than 0.';return}if(!date){$('#e').textContent='Choose a date.';return}return{amt,cat:v('ca'),date,desc:v('de').trim()}}
const A={
pw(){S.pw=!S.pw;const u=v('u');draw();$('#u').value=u},
forgot(){say('Password reset is not part of the provided screens.')},signup(){go('signup')},
ntog(){S.ns.on=!S.ns.on;if(S.ns.on)play(S.ns.sound);go('notifs')},
nsnd(t){S.ns.sound=t.dataset.v;play(S.ns.sound);go('notifs')},

cur(t){S.cur=t.dataset.v;go('currency');say('Currency updated.')},
saveprof(){const n=v('pn').trim();if(!n)return $('#e').textContent='Enter your name.';S.user={name:n,email:v('pm').trim()};go('settings');say('Profile saved.')},
addcat(){const n=v('cn').trim(),e=$('#e');if(!n)return e.textContent='Enter a category name.';if(!/^[\p{L}\p{N} ]+$/u.test(n))return e.textContent='Use letters, numbers and spaces only.';if(Object.keys(CAT).some(k=>k.toLowerCase()===n.toLowerCase()))return e.textContent='That category already exists.';const m=v('ci').trim();CAT[n]=m&&!/[<>"'&]/.test(m)?m:'🏷️';go('cats');say('Category added.')},
delcat(t){const k=t.dataset.v;if(S.bs.some(b=>b.cat===k)||S.ex.some(x=>x.cat===k))return say('Remove its budgets and expenses first.');delete CAT[k];go('cats')},
signup2(){const e=m=>$('#e').textContent=m;if(!v('sn').trim())return e('Enter your full name.');if(!/^\S+@\S+\.\S+$/.test(v('se')))return e('Enter a valid email address.');if(v('sp').length<8)return e('Password must be at least 8 characters.');if(v('sp')!==v('sc'))return e('Passwords do not match.');S.user.name=v('sn').trim();go('login');say('Account created. Log in to continue.')},
soon(e){say(e.dataset.n+' is not part of the provided screens.')},
login(){if(!v('u').trim()||!v('p')){$('#e').textContent='Enter your email or username and password.';return}pickQuote();go('home')},
saveb(){const e=m=>$('#e').textContent=m,amount=parseFloat(v('a')),sd=v('s'),p=v('pe'),old=S.edb&&S.bs.find(x=>x.id===S.bid);if(!(amount>0))return e('Enter an amount greater than 0.');if(!sd)return e('Choose a start date.');if(sd<TODAY&&!(old&&old.start===sd))return e('Start date cannot be in the past.');const o={cat:v('ca'),amount,period:p,start:sd,end:endOf(sd,p)};if(old)Object.assign(old,o);else{S.bs.push({id:++S.id,...o});S.bid=S.id}note(old?'Budget updated':'Budget saved',o.cat+' budget: '+f(amount)+' ('+p.toLowerCase()+')','✔');S.edb=false;S.flash='Budget successfully saved!';go('home')},
editb(){S.edb=true;go('addbudget')},delb(){S.modal='db';draw()},db2(){S.bs=S.bs.filter(b=>b.id!==S.bid);S.modal='';go('budget')},
savex(){const x=readX();if(!x)return;x.id=++S.id;S.ex.push(x);S.last=x;{const bb=S.bs.find(b=>b.cat===x.cat&&x.date>=b.start&&x.date<=b.end);if(bb&&pc(bb)>=.8)note('Budget alert','You have used '+Math.round(pc(bb)*100)+'% of your '+bb.cat+' budget.','🔔')}note('Expense added',f2(x.amt)+' · '+x.cat,'✔');go('saved')},
savech(){const x=readX();if(!x)return;Object.assign(S.ex.find(e=>e.id===S.eid),x);go('tx');say('Changes saved.')},
delx(){S.ex=S.ex.filter(e=>e.id!==S.eid);go('tx');say('Expense deleted.')},
readall(){S.nt.forEach(n=>n.r=1);draw()},
lo(){S.modal='lo';draw()},cx(){S.modal='';draw()},lo2(){S.modal='';go('out')}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-act],[data-edit],[data-f],[data-b]');if(!t)return;if(t.dataset.b){S.bid=+t.dataset.b;return go('bdet')}
if(t.dataset.f){S.filter=t.dataset.f;return go('tx')}
if(t.dataset.edit){S.eid=+t.dataset.edit;return go('edit')}
if(t.dataset.act)return A[t.dataset.act](t);
if(t.dataset.go==='rep')return say('Reports are not part of the provided screens.');
if(t.dataset.go==='addbudget')S.edb=false;
go(t.dataset.go)});
document.addEventListener('input',e=>{if(['a','s','pe'].includes(e.target.id)&&$('#en')){const sd=v('s')||TODAY,p=v('pe');$('#en').value=endOf(sd,p);$('#pdh').textContent=hint(+v('a'),sd,p)}if(e.target.id==='pf'){S.pf=e.target.value;$('#list').innerHTML=list()}if(e.target.id==='q'){S.q=e.target.value;$('#list').innerHTML=list()}});
pickQuote();draw();
})();</script></body></html>
